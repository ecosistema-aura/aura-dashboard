<main class="launcher">
  <header class="brand">
    <img src="/logo_aura_mini.jpg" alt="Logo AURA" class="logo">
    <h1>AURA</h1>
  </header>

  <nav class="routes" aria-label="Aplicaciones del ecosistema">
    @for (item of links; track item.name) {
      <a [href]="item.url" target="_blank" rel="noopener noreferrer" class="route-btn">
        <span>{{ item.name }}</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="arrow" aria-hidden="true">
          <line x1="7" y1="17" x2="17" y2="7"></line>
          <polyline points="7 7 17 7 17 17"></polyline>
        </svg>
      </a>
    }
  </nav>
</main>
