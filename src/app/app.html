@if (showIntro()) {
  <aside class="intro-overlay" [class.fade-out]="isIntroFading()" aria-label="Pantalla de bienvenida">
    <div class="intro-content">
      <!-- Tarjeta de pedestal blanca para el logo oficial con halo rojo idéntico a Nosotros -->
      <div class="intro-pedestal-wrap">
        <div class="intro-halo" aria-hidden="true"></div>
        <div class="intro-pedestal">
          <img src="/logo_aura.jpg" alt="AURA Logo Oficial" class="intro-logo">
        </div>
      </div>

      <!-- Texto de Bienvenida -->
      <div class="intro-text">
        <span class="intro-badge">ECOSISTEMA AURA</span>
        <h1 class="intro-title">Bienvenido a AURA Directorio</h1>
      </div>

      <!-- Barra de progreso de 3 segundos -->
      <div class="intro-progress-bar" aria-hidden="true">
        <div class="intro-progress-fill"></div>
      </div>
    </div>
  </aside>
}

<main class="launcher">
  <header class="brand">
    <img src="/logo_aura_mini.jpg" alt="Logo AURA" class="brand-logo">
    <div class="brand-text">
      <h2>AURA</h2>
      <p>Directorio del Ecosistema</p>
    </div>
  </header>

  <section class="cards-grid" aria-label="Aplicaciones del ecosistema">
    @for (app of apps; track app.name) {
      <a
        [href]="app.url"
        target="_blank"
        rel="noopener noreferrer"
        class="site-card"
      >
        <div class="card-image-wrap">
          <img [src]="app.image" [alt]="app.name" class="card-img" loading="lazy">
          <span class="card-tag">{{ app.tag }}</span>
        </div>

        <div class="card-body">
          <div class="card-title-row">
            <h3>{{ app.name }}</h3>
          </div>
          <p class="card-desc">{{ app.description }}</p>

          <div class="card-action">
            <span>Acceder</span>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="arrow-icon" aria-hidden="true">
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </div>
        </div>
      </a>
    }
  </section>

  <footer class="footer">
    <span>Ecosistema AURA</span>
  </footer>
</main>
